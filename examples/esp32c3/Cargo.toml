[package]
name = "brewscale-esp32c3"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
brewscale = { path = "../../brewscale", default-features = false, features = ["bookoo", "trouble"] }
trouble-host = { version = "0.8", default-features = false, features = ["central", "gatt", "scan", "log", "default-packet-pool-mtu-255"] }
embassy-executor = "0.10"
embassy-futures = "0.1"
embassy-time = "0.5"
esp-alloc = "0.11"
esp-backtrace = { version = "0.20", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c3"] }
esp-hal = { version = "1.2", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.18", features = ["esp32c3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c3", "ble", "unstable", "log-04"] }
esp-rtos = { version = "0.4", features = ["esp32c3", "embassy", "esp-alloc", "esp-radio", "log-04"] }
log = "0.4"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "thin"
opt-level = "s"
