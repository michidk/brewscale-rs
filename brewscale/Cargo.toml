[package]
name = "brewscale"
description = "Protocol-agnostic BLE coffee-scale API for desktop and embedded systems"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["no-std", "ble", "scale", "coffee", "embedded"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
btleplug = { version = "0.13", optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
tokio = { version = "1", default-features = false, features = ["macros"], optional = true }
uuid = { version = "1", optional = true }
trouble-host = { version = "0.8", default-features = false, features = ["central", "gatt", "scan"], optional = true }
bt-hci = { version = "0.10", optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-futures = { version = "0.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"], optional = true }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "macros"] }

[package.metadata.docs.rs]
all-features = true

[features]
default = ["bookoo"]
std = []
mock = []
bookoo = []
btleplug = ["std", "dep:btleplug", "dep:futures", "dep:tokio", "dep:uuid", "dep:libdbus-sys"]
trouble = ["dep:trouble-host", "dep:bt-hci", "dep:embassy-sync", "dep:embassy-futures"]

[[example]]
name = "desktop"
required-features = ["btleplug", "bookoo"]
