[package]
name = "brewscale-trouble"
description = "TrouBLE (trouble-host) BLE central backend for brewscale: no_std, no alloc, any HCI controller"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["no-std", "ble", "trouble", "esp32", "embedded"]
categories = ["embedded", "no-std::no-alloc", "hardware-support"]

[dependencies]
brewscale-core = { version = "0.1.0", path = "../brewscale-core", default-features = false }
trouble-host = { version = "0.8", default-features = false, features = ["central", "gatt", "scan"] }
bt-hci = "0.10"
embassy-sync = "0.8"
embassy-futures = "0.1"
